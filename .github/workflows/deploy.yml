name: Deploy to Production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy Backend
        run: |
          rsync -avz ./backend/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/var/www/algorysoft/ \
          --exclude 'venv' \
          --exclude '__pycache__' \
          --exclude '.env'

      - name: Deploy Frontend
        run: |
          rsync -avz ./frontend/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/var/www/frontend/ \
          --exclude 'node_modules'

      - name: Setup and Restart Services
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          set -e

          echo "===== BACKEND SETUP ====="
          cd /var/www/algorysoft

          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi

          source venv/bin/activate

          pip install --upgrade pip
          pip install -r requirements.txt

          echo "Fixing STATIC_ROOT..."
          if ! grep -q STATIC_ROOT algorysoft/settings.py; then
            echo 'STATIC_ROOT = BASE_DIR / "staticfiles"' >> algorysoft/settings.py
          fi

          echo "Running migrations..."
          python manage.py migrate

          echo "Collecting static..."
          python manage.py collectstatic --noinput || true

          echo "Restarting Django..."
          sudo systemctl restart django


          echo "===== FRONTEND SETUP ====="
          cd /var/www/frontend

          npm install
          npm run build

          echo "Restarting Next.js..."
          sudo systemctl restart nextjs


          echo "===== NGINX ====="
          sudo systemctl restart nginx


          echo "===== STATUS ====="
          sudo systemctl status django --no-pager
          sudo systemctl status nextjs --no-pager
          sudo systemctl status nginx --no-pager

          EOF
