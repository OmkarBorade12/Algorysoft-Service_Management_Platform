name: Deploy to Production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup SSH
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3. Add server to known hosts
      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # 4. Deploy backend
      - name: Deploy Backend
        run: |
          rsync -avz --delete ./backend/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/var/www/algorysoft/

      # 5. Deploy frontend
      - name: Deploy Frontend
        run: |
          rsync -avz --delete ./frontend/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/var/www/frontend/

      # 6. Setup + Restart services
      - name: Setup and Restart Services
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'

            echo "===== BACKEND SETUP ====="
            cd /var/www/algorysoft

            # Create venv if not exists
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate

            echo "Installing backend dependencies..."
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "Ensuring gunicorn..."
            pip install gunicorn

            echo "Running migrations..."
            python manage.py migrate

            echo "Collecting static..."
            python manage.py collectstatic --noinput

            echo "Restarting Django..."
            sudo systemctl restart django


            echo "===== FRONTEND SETUP ====="
            cd /var/www/frontend

            echo "Installing frontend dependencies..."
            npm install

            echo "Building Next.js..."
            npm run build

            echo "Restarting Next.js..."
            sudo systemctl restart nextjs


            echo "===== NGINX ====="
            sudo systemctl restart nginx


            echo "===== STATUS ====="
            sudo systemctl status django --no-pager
            sudo systemctl status nextjs --no-pager
            sudo systemctl status nginx --no-pager

          EOF