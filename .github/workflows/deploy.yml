name: Deploy to Production Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ secrets.SERVER_IP || vars.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
      # Frontend env vars
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Verify Secrets
        run: |
          if [ -z "$SERVER_IP" ]; then 
            echo "❌ SERVER_IP missing. Add it to Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "$SERVER_USER" ]; then 
            echo "❌ SERVER_USER missing. Add it to Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "✅ Connection secrets (IP and User) are present."

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Use ssh-keyscan with a timeout and retry mechanism, allowing it to fail without breaking the build
          # as we'll also use StrictHostKeyChecking=no in subsequent commands for better reliability.
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts || echo "⚠️ Warning: ssh-keyscan failed to find host keys"
          chmod 600 ~/.ssh/known_hosts
          echo "✅ SSH setup complete"

      - name: Deploy Backend Files
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            ./backend/ "$SERVER_USER@$SERVER_IP":/var/www/algorysoft/ \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude '.env' \
            --exclude '*.pyc' \
            --exclude 'db.sqlite3' \
            --exclude 'media/' \
            --exclude 'staticfiles/'

      - name: Deploy Frontend Files
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            ./frontend/ "$SERVER_USER@$SERVER_IP":/var/www/frontend/ \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env.local'

      - name: Write Production .env.local
        run: |
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "cat > /var/www/frontend/.env.local" << EOF
          RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID
          RAZORPAY_KEY_SECRET=$RAZORPAY_KEY_SECRET
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
          NEXTAUTH_SECRET=$NEXTAUTH_SECRET
          NEXTAUTH_URL=$NEXTAUTH_URL
          NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
          EMAIL_USER=$EMAIL_USER
          EMAIL_PASS=$EMAIL_PASS
          EOF
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "chmod 600 /var/www/frontend/.env.local"

      - name: Setup and Restart Services
        run: |
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" << 'EOF'
          set -e
          
          echo ">>> Setting up Backend..."
          cd /var/www/algorysoft
          # Install system dependencies for xhtml2pdf (pycairo)
          sudo apt-get update
          sudo apt-get install -y pkg-config libcairo2-dev python3-dev
          
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          
          # Migration and Static
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput

          echo ">>> Setting up Frontend..."
          cd /var/www/frontend
          # Use --legacy-peer-deps to avoid dependency conflicts on server
          npm install --legacy-peer-deps
          npm run build

          echo ">>> Optimizing Nginx..."
          # Fix client_max_body_size if not set
          if ! sudo grep -q "client_max_body_size" /etc/nginx/nginx.conf; then
            sudo sed -i 's/http {/http {\n    client_max_body_size 50m;/' /etc/nginx/nginx.conf
            sudo systemctl reload nginx
          fi

          echo ">>> Restarting Services..."
          sudo systemctl restart django || echo "⚠️ Failed to restart django service"
          sudo systemctl restart nextjs || echo "⚠️ Failed to restart nextjs service"
          sudo systemctl restart nginx
          
          echo ">>> Deployment Complete!"
          EOF
