name: Deploy to Production Server

# Trigger on push to main branch
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup SSH Private Key
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3. Add Server IP to Known Hosts
      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # 4. Deploy Backend
      # Local: ./backend/ -> Server: /var/www/algorysoft
      - name: Deploy Backend
        run: |
          rsync -avz --delete ./backend/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/var/www/algorysoft

      # 5. Deploy Frontend
      # Local: ./frontend/ -> Server: /var/www/frontend
      - name: Deploy Frontend
        run: |
          rsync -avz --delete ./frontend/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/var/www/frontend

      # 6. Restart Services (Django, Next.js, Nginx)
      - name: Restart Services
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            echo "Starting Django..."
            sudo systemctl start django
            sudo systemctl enable django

            echo "Starting Next.js..."
            sudo systemctl start nextjs
            sudo systemctl enable nextjs

            echo "Restarting Nginx..."
            sudo systemctl restart nginx

            echo "--- Service Status ---"
            sudo systemctl status django --no-pager
            sudo systemctl status nextjs --no-pager
            sudo systemctl status nginx --no-pager
          EOF