name: Deploy to Production Server

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup SSH Key
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3. Add Server to Known Hosts
      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # 4. Deploy Backend Code
      - name: Deploy Backend
        run: |
          rsync -avz --delete ./backend/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/var/www/algorysoft

      # 5. Deploy Frontend Code
      - name: Deploy Frontend
        run: |
          rsync -avz --delete ./frontend/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/var/www/frontend

      # 6. Build & Restart Services
      - name: Build & Restart Services
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'

            echo "================ BACKEND ================="
            cd /var/www/algorysoft

            # Activate virtual environment
            if [ -d "venv" ]; then
              source venv/bin/activate
            fi

            # Install dependencies
            pip install -r requirements.txt

            # Django setup
            python manage.py migrate
            python manage.py collectstatic --noinput

            # Restart Django service
            sudo systemctl restart django
            sudo systemctl enable django

            echo "================ FRONTEND ================="
            cd /var/www/frontend

            # Install dependencies
            npm install

            # Build Next.js app
            npm run build

            # Restart Next.js service
            sudo systemctl restart nextjs
            sudo systemctl enable nextjs

            echo "================ NGINX ================="
            sudo nginx -t
            sudo systemctl restart nginx

            echo "================ STATUS ================="
            sudo systemctl status django --no-pager
            sudo systemctl status nextjs --no-pager
            sudo systemctl status nginx --no-pager

          EOF
